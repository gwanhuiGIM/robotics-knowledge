<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" width="100%" font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3e9ef"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="538" rx="10" fill="#12191f" stroke="#2c3946"/>

  <!-- Python -->
  <text x="20" y="30" font-size="13" font-weight="700" fill="#6fa6ea">Python — 클로저 + GC</text>
  <rect x="20" y="44" width="140" height="42" rx="6" fill="none" stroke="#8a99a8" stroke-dasharray="5 4"/>
  <text x="90" y="62" text-anchor="middle" font-size="12" fill="#e3e9ef">_on_plan 프레임</text>
  <text x="90" y="78" text-anchor="middle" font-size="10.5" fill="#93a2b1">이미 반환됨</text>
  <g font-size="11.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef" text-anchor="middle">
    <rect x="20" y="102" width="140" height="28" rx="5" fill="#172a40" stroke="#6fa6ea"/><text x="90" y="121">cb (i=0)</text>
    <rect x="20" y="140" width="140" height="28" rx="5" fill="#172a40" stroke="#6fa6ea"/><text x="90" y="159">cb (i=1)</text>
    <rect x="20" y="178" width="140" height="28" rx="5" fill="#172a40" stroke="#6fa6ea"/><text x="90" y="197">cb (i=N-1)</text>
  </g>
  <rect x="300" y="112" width="200" height="82" rx="6" fill="#222d38" stroke="#e3e9ef" stroke-width="1.3"/>
  <g font-size="11.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef" text-anchor="middle">
    <text x="400" y="138">results = [None]*N</text>
    <text x="400" y="160">pending = [N]</text>
  </g>
  <text x="400" y="182" text-anchor="middle" font-size="10.5" fill="#93a2b1">gen은 int 값으로 캡처</text>
  <g stroke="#e3e9ef" stroke-width="1.2">
    <line x1="160" y1="116" x2="298" y2="138" marker-end="url(#ar)"/>
    <line x1="160" y1="154" x2="298" y2="154" marker-end="url(#ar)"/>
    <line x1="160" y1="192" x2="298" y2="170" marker-end="url(#ar)"/>
  </g>
  <text x="229" y="106" text-anchor="middle" font-size="10.5" fill="#e3e9ef">참조 캡처</text>
  <text x="20" y="232" font-size="11.5" fill="#e3e9ef">future가 cb를, cb가 리스트를 붙잡고 있는 동안 살아 있음.</text>
  <text x="20" y="250" font-size="11.5" fill="#93a2b1">마지막 참조가 사라지면 참조 카운트/GC가 회수.</text>

  <line x1="20" y1="270" x2="500" y2="270" stroke="#2c3946"/>

  <!-- C++ -->
  <text x="20" y="300" font-size="13" font-weight="700" fill="#b98ae6">C++ — shared_ptr 공동 소유</text>
  <rect x="20" y="314" width="140" height="42" rx="6" fill="none" stroke="#8a99a8" stroke-dasharray="5 4"/>
  <text x="90" y="332" text-anchor="middle" font-size="12" fill="#e3e9ef">onPlan 스택</text>
  <text x="90" y="348" text-anchor="middle" font-size="10.5" fill="#93a2b1">지역 batch 소멸</text>
  <g font-size="11.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef" text-anchor="middle">
    <rect x="20" y="372" width="140" height="28" rx="5" fill="#2a1d3a" stroke="#b98ae6"/><text x="90" y="391">lambda [0]</text>
    <rect x="20" y="410" width="140" height="28" rx="5" fill="#2a1d3a" stroke="#b98ae6"/><text x="90" y="429">lambda [1]</text>
    <rect x="20" y="448" width="140" height="28" rx="5" fill="#2a1d3a" stroke="#b98ae6"/><text x="90" y="467">lambda [N-1]</text>
  </g>
  <rect x="300" y="380" width="200" height="88" rx="6" fill="#222d38" stroke="#e3e9ef" stroke-width="1.3"/>
  <text x="400" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e9ef">BatchState (heap)</text>
  <g font-size="11" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef" text-anchor="middle">
    <text x="400" y="421">vector&lt;optional&lt;Point&gt;&gt;</text>
    <text x="400" y="439">size_t pending</text>
  </g>
  <text x="400" y="458" text-anchor="middle" font-size="10.5" fill="#93a2b1">use_count = N</text>
  <g stroke="#e3e9ef" stroke-width="1.2">
    <line x1="160" y1="386" x2="298" y2="408" marker-end="url(#ar)"/>
    <line x1="160" y1="424" x2="298" y2="424" marker-end="url(#ar)"/>
    <line x1="160" y1="462" x2="298" y2="440" marker-end="url(#ar)"/>
  </g>
  <text x="229" y="376" text-anchor="middle" font-size="10.5" fill="#e3e9ef">값 복사 캡처</text>
  <text x="20" y="504" font-size="11.5" fill="#e3e9ef">람다마다 shared_ptr 사본을 하나씩 소유.</text>
  <text x="20" y="522" font-size="11.5" fill="#93a2b1">마지막 람다가 소멸해 use_count가 0이 되는 순간 delete.</text>
</svg>
