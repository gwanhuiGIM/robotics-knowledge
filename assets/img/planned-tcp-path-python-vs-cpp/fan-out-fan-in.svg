<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="100%" font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3e9ef"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0a050"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade6e"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="458" rx="10" fill="#12191f" stroke="#2c3946"/>

  <!-- lane heads -->
  <rect x="12" y="14" width="136" height="32" rx="6" fill="#222d38" stroke="#e3e9ef" stroke-width="1.3"/>
  <text x="80" y="35" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e3e9ef">노드 콜백</text>
  <rect x="222" y="14" width="136" height="32" rx="6" fill="#1c2630" stroke="#2c3946"/>
  <text x="290" y="35" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef">/compute_fk</text>
  <rect x="368" y="14" width="140" height="32" rx="6" fill="#1c2630" stroke="#2c3946"/>
  <text x="438" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#e3e9ef">BatchState</text>
  <line x1="80" y1="46" x2="80" y2="440" stroke="#5a6b7c" stroke-dasharray="3 4"/>
  <line x1="290" y1="46" x2="290" y2="440" stroke="#5a6b7c" stroke-dasharray="3 4"/>

  <!-- onPlan -->
  <rect x="72" y="60" width="16" height="112" fill="#172a40" stroke="#6fa6ea"/>
  <text x="14" y="80" font-size="10.5" fill="#93a2b1">onPlan</text>
  <text x="14" y="95" font-size="10.5" fill="#93a2b1">gen = 1</text>

  <g font-size="10.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef" text-anchor="middle">
    <line x1="88" y1="76" x2="286" y2="76" stroke="#e3e9ef" stroke-width="1.3" marker-end="url(#ar)"/><text x="187" y="70">req[0]  q₀</text>
    <line x1="88" y1="104" x2="286" y2="104" stroke="#e3e9ef" stroke-width="1.3" marker-end="url(#ar)"/><text x="187" y="98">req[1]  q₁</text>
    <line x1="88" y1="132" x2="286" y2="132" stroke="#e3e9ef" stroke-width="1.3" marker-end="url(#ar)"/><text x="187" y="126">req[2]  q₂</text>
    <line x1="88" y1="160" x2="286" y2="160" stroke="#e3e9ef" stroke-width="1.3" marker-end="url(#ar)"/><text x="187" y="154">req[3]  q₃ (마지막 점)</text>
  </g>

  <!-- state column header + initial -->
  <text x="374" y="72" font-size="10.5" fill="#93a2b1">results</text>
  <text x="506" y="72" text-anchor="end" font-size="10.5" fill="#93a2b1">pending</text>
  <g font-size="11" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef">
    <text x="374" y="96">[ ·  ·  ·  · ]</text><text x="500" y="96" text-anchor="end">4</text>
  </g>

  <text x="96" y="194" font-size="10.5" fill="#93a2b1">onPlan은 여기서 바로 반환 — 응답을 기다리지 않음</text>

  <!-- responses -->
  <g font-size="10.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef" text-anchor="middle">
    <line x1="290" y1="230" x2="92" y2="230" stroke="#e3e9ef" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="190" y="224">resp[2] → p₂</text>
    <line x1="290" y1="274" x2="92" y2="274" stroke="#e3e9ef" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="190" y="268">resp[0] → p₀</text>
    <line x1="290" y1="318" x2="92" y2="318" stroke="#f0a050" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arw)"/><text x="190" y="312" fill="#f0a050">resp[3] → FK 실패</text>
    <line x1="290" y1="362" x2="92" y2="362" stroke="#e3e9ef" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="190" y="356">resp[1] → p₁</text>
  </g>
  <g fill="#172a40" stroke="#6fa6ea">
    <rect x="72" y="222" width="16" height="16"/><rect x="72" y="266" width="16" height="16"/><rect x="72" y="310" width="16" height="16"/><rect x="72" y="354" width="16" height="54"/>
  </g>
  <g stroke="#5a6b7c">
    <line x1="296" y1="230" x2="368" y2="230"/><line x1="296" y1="274" x2="368" y2="274"/><line x1="296" y1="318" x2="368" y2="318"/><line x1="296" y1="362" x2="368" y2="362"/>
  </g>
  <g font-size="11" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef">
    <text x="374" y="234">[ ·  ·  p₂ · ]</text><text x="500" y="234" text-anchor="end">3</text>
    <text x="374" y="278">[ p₀ ·  p₂ · ]</text><text x="500" y="278" text-anchor="end">2</text>
    <text x="374" y="322">[ p₀ ·  p₂ ∅ ]</text><text x="500" y="322" text-anchor="end">1</text>
    <text x="374" y="366" font-weight="700">[ p₀ p₁ p₂ ∅ ]</text><text x="500" y="366" text-anchor="end" font-weight="700">0</text>
  </g>
  <text x="374" y="340" font-size="10" fill="#f0a050">실패 칸은 비우고 감소만</text>

  <!-- publish -->
  <line x1="88" y1="398" x2="282" y2="398" stroke="#4ade6e" stroke-width="2" marker-end="url(#arg)"/>
  <text x="96" y="391" font-size="11" fill="#e3e9ef">pending 0을 본 이 콜백만 publishLine</text>
  <text x="96" y="424" font-size="10.5" fill="#93a2b1">빈 칸 제외 → p₀ p₁ p₂ (waypoint 순서 유지) → Marker 3점</text>
</svg>
