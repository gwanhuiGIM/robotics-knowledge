<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="100%" font-family="system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3e9ef"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ade6e"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="618" rx="10" fill="#12191f" stroke="#2c3946"/>

  <!-- move_group -->
  <rect x="20" y="20" width="480" height="130" rx="10" fill="#1c2630" stroke="#2c3946"/>
  <text x="260" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#e3e9ef">move_group</text>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#93a2b1">MoveIt (외부 프로세스)</text>
  <rect x="40" y="76" width="200" height="54" rx="6" fill="#222d38" stroke="#5a6b7c"/>
  <text x="140" y="99" text-anchor="middle" font-size="12" fill="#e3e9ef">planner</text>
  <text x="140" y="117" text-anchor="middle" font-size="10.5" fill="#93a2b1">plan 성공 시 발행</text>
  <rect x="280" y="76" width="200" height="54" rx="6" fill="#222d38" stroke="#5a6b7c"/>
  <text x="380" y="99" text-anchor="middle" font-size="12" fill="#e3e9ef">FK 서비스</text>
  <text x="380" y="117" text-anchor="middle" font-size="10.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#93a2b1">/compute_fk</text>

  <!-- topic: display_planned_path -->
  <line x1="140" y1="130" x2="140" y2="228" stroke="#e3e9ef" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="150" y="160" font-size="10.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef">/move_group/</text>
  <text x="150" y="175" font-size="10.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef">display_planned_path</text>
  <text x="150" y="192" font-size="10" fill="#93a2b1">DisplayTrajectory · 구독</text>

  <!-- FK request / response -->
  <line x1="360" y1="228" x2="360" y2="133" stroke="#e3e9ef" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="352" y="196" text-anchor="end" font-size="10.5" fill="#e3e9ef">요청 N개</text>
  <text x="352" y="211" text-anchor="end" font-size="10" fill="#93a2b1">(기다리지 않음)</text>
  <line x1="430" y1="130" x2="430" y2="226" stroke="#e3e9ef" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="438" y="160" font-size="10.5" fill="#e3e9ef">응답 N개</text>
  <text x="438" y="175" font-size="10" fill="#93a2b1">순서 보장 없음</text>
  <text x="438" y="192" font-size="10" fill="#93a2b1">tool0 pose</text>
  <text x="438" y="206" font-size="10" fill="#93a2b1">(base_link 기준)</text>

  <!-- node -->
  <rect x="20" y="230" width="480" height="212" rx="10" fill="#222d38" stroke="#e3e9ef" stroke-width="1.5"/>
  <text x="260" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#e3e9ef">planned_tcp_path_node</text>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#93a2b1">Python · C++ 동일 구조</text>
  <rect x="40" y="284" width="440" height="30" rx="5" fill="#1c2630"/>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#e3e9ef">① 첫 trajectory · 빈 points면 무시</text>
  <rect x="40" y="320" width="440" height="30" rx="5" fill="#1c2630"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#e3e9ef">② downsample (마지막 점은 항상 포함)</text>
  <rect x="40" y="356" width="440" height="30" rx="5" fill="#1c2630"/>
  <text x="260" y="376" text-anchor="middle" font-size="12" fill="#e3e9ef">③ generation += 1 · FK 요청 N개 발사</text>
  <rect x="40" y="392" width="440" height="40" rx="5" fill="#173524" stroke="#4ade6e"/>
  <text x="260" y="409" text-anchor="middle" font-size="12" fill="#e3e9ef">④ 응답 모으기 → pending 0이면</text>
  <text x="260" y="425" text-anchor="middle" font-size="11" fill="#93a2b1">성공한 점 ≥ 2개일 때 Marker 발행</text>

  <!-- publish -->
  <line x1="260" y1="442" x2="260" y2="490" stroke="#4ade6e" stroke-width="2" marker-end="url(#arg)"/>
  <text x="272" y="461" font-size="10.5" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" fill="#e3e9ef">/pick/planned_tcp_path</text>
  <text x="272" y="477" font-size="10" fill="#93a2b1">Marker · id 0 고정 → 덮어쓰기</text>

  <!-- RViz -->
  <rect x="120" y="492" width="280" height="112" rx="10" fill="#1c2630" stroke="#2c3946"/>
  <text x="260" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#e3e9ef">RViz</text>
  <polyline points="160,575 195,558 222,561 258,543 292,540 340,528" fill="none" stroke="#4ade6e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="575" r="3.5" fill="#4ade6e"/><circle cx="340" cy="528" r="3.5" fill="#4ade6e"/>
  <text x="260" y="594" text-anchor="middle" font-size="10.5" fill="#93a2b1">LINE_STRIP · 굵기 0.008 m</text>
</svg>
