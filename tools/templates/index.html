<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics Knowledge Lab | 로보틱스 질문 기록</title>
<style>
:root{color-scheme:dark;--bg:#111318;--card:#1a1d23;--line:#33373e;--text:#eceef0;--muted:#a6abb3;--dim:#7e858e;--accent:#9fc3dc;--q:#16232c;--qline:#3c6a86}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.7 system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text)}
.wrap{max-width:880px;margin:auto;padding:0 24px}
.hero{padding-top:56px;padding-bottom:26px}
.brand{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase}
h1{font-size:clamp(28px,5vw,40px);line-height:1.25;margin:10px 0 14px;letter-spacing:-.5px}
.intro{color:var(--muted);font-size:17px;max-width:680px;margin:0 0 18px}
.stats{color:var(--dim);font-size:14px}.stats b{color:var(--text);font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:var(--card);color:#c3c8cf;font:inherit;font-size:14px;cursor:pointer}
.chip b{color:var(--dim);font-weight:600;margin-left:3px}.chip:hover{border-color:#6b737c}
.chip.active{background:#2b3540;border-color:var(--accent);color:#fff}.chip.active b{color:var(--accent)}
input{width:100%;margin-top:10px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 14px;font:inherit;font-size:15px}
.cat{padding-top:34px}.cat[hidden],.item[hidden],#empty[hidden]{display:none!important}
.cat h2{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cat h2 span{color:var(--dim);font-weight:500;margin-left:4px}
.item{padding:20px 0 22px;border-bottom:1px solid var(--line)}
.item-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.item-link{color:inherit;text-decoration:none}.item-link:hover h3,.item-link:focus h3{text-decoration:underline;text-underline-offset:4px}
.item h3{font-size:20px;line-height:1.4;margin:0}
.item-label{font-size:12px;color:var(--dim)}
.q{margin:10px 0 0;padding:9px 14px 9px 38px;background:var(--q);border-left:3px solid var(--qline);border-radius:0 8px 8px 0;position:relative;color:#d9e4ea}
.q::before{content:"Q";position:absolute;left:13px;top:8px;font-weight:800;color:var(--accent)}
.q p{margin:0;white-space:pre-line;overflow-wrap:anywhere}.q-note{display:block;margin-top:3px;font-size:12px;color:var(--dim)}
.q-none{background:transparent;border-left-color:var(--line);color:var(--dim);font-size:14px}.q-none::before{color:var(--dim)}
.more-q summary{cursor:pointer;color:var(--accent);font-size:13px;margin:6px 0 0;width:max-content}
.sum{color:var(--muted);font-size:15px;margin:10px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;color:#bfc4cd;border:1px solid #474c54;border-radius:99px;padding:2px 9px}
.meta time{margin-left:auto;font-size:12px;color:var(--dim)}
.mode{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.3px}.mode-original_qa{background:#1f3a2b;color:#9fdcb5}.mode-new_answer{background:#3a3220;color:#e8cf8f}.mode-reconstructed{background:#3a2430;color:#e7a9c4}
#empty{color:var(--muted);padding:30px 0}
footer{font-size:12px;color:var(--dim);padding:40px 0 50px}
@media(max-width:650px){.wrap{padding:0 16px}.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.hero{padding-top:36px}.item h3{font-size:18px}.q{padding-left:32px}.q::before{left:10px}}
</style></head><body>
<header class="wrap hero"><div class="brand">Robotics Knowledge Lab</div><h1>로보틱스 용어, 직접 물어본 기록</h1>
<p class="intro"><!--INTRO--></p><div class="stats"><!--STATS--></div></header>
<div class="bar"><div class="wrap"><nav class="chips" aria-label="분야 선택"><!--CHIPS--></nav>
<input id="q" type="search" placeholder="⌕ 용어, 질문, 키워드, 태그 검색" aria-label="용어·질문·키워드 검색"></div></div>
<main class="wrap" id="list">
<!--SECTIONS-->
<p id="empty" hidden>일치하는 게시 자료가 없습니다.</p></main>
<footer class="wrap">로보틱스 학습 아카이브 · 제목을 누르면 질문과 답변 전문으로 이동합니다.</footer>
<script>let cat="all";function filter(){let q=document.getElementById("q").value.trim().toLowerCase(),shown=0;document.querySelectorAll(".item").forEach(a=>{let text=(a.textContent+" "+a.dataset.search+" "+a.dataset.q).toLowerCase(),yes=(cat==="all"||a.dataset.category===cat)&&text.includes(q);a.hidden=!yes;if(yes)shown++});document.querySelectorAll(".cat").forEach(s=>{s.hidden=!s.querySelector(".item:not([hidden])")});document.getElementById("empty").hidden=shown>0}document.querySelector("#q").addEventListener("input",filter);document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));filter()}));</script></body></html>
