<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics Knowledge Lab | 게시된 학습 자료</title>
<style>
:root{color-scheme:dark;--bg:#111318;--card:#1c1f25;--line:#373b42;--text:#eceef0;--muted:#a6abb3;--accent:#c4ccd2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.7 system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text)}
header,footer{padding:23px 30px}main{max-width:1120px;margin:auto;padding:28px 30px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 80px)}nav{background:#16191e;border-right:1px solid var(--line);padding:22px 12px}nav .navtitle{font-size:12px;letter-spacing:1px;color:#8f959e;padding:12px}nav button{display:block;text-align:left;width:100%;border:0;background:transparent;margin:3px 0;padding:12px 14px;color:#bdc2c9}nav button.active,nav button:hover{background:#30343b;color:white}header{border-bottom:1px solid var(--line)}header{border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:750;letter-spacing:-.4px}h1{font-size:clamp(27px,4vw,38px);line-height:1.3;margin:35px 0 10px}p{color:var(--muted)}.bar{display:flex;gap:10px;margin:28px 0 23px;flex-wrap:wrap}input{min-width:210px;flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:13px}button{border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:var(--card);color:var(--text);cursor:pointer}button.active{background:#3b4148;border-color:#747b83}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.article{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);padding:24px;border-radius:13px}.article[hidden],#empty[hidden]{display:none!important}.article:hover{border-color:#89949f}.category{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:1px}.article h2{font-size:20px;line-height:1.4;margin:10px 0}.article p{font-size:14px;margin:0 0 16px}.tag{font-size:12px;color:#bfc4cd;border:1px solid #4b5058;border-radius:99px;padding:4px 8px;display:inline-block;margin-right:4px}footer{font-size:12px;color:#7e858e;padding-top:40px}.mode{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;margin-left:8px;vertical-align:1px;letter-spacing:.3px}.mode-original_qa{background:#1f3a2b;color:#9fdcb5}.mode-new_answer{background:#3a3220;color:#e8cf8f}.mode-reconstructed{background:#3a2430;color:#e7a9c4}@media(max-width:650px){.grid{grid-template-columns:1fr}.shell{display:block}nav{display:flex;overflow-x:auto;gap:4px;padding:9px}nav .navtitle{display:none}nav button{width:auto;white-space:nowrap}main,header,footer{padding-left:18px;padding-right:18px}}
</style></head><body><header><div class="brand">Robotics Knowledge Lab</div></header>
<div class="shell"><nav aria-label="기술 분야 탐색"><div class="navtitle">EXPLORE</div><button class="active" data-filter="all">⌂ 모든 기술 자료</button><button data-filter="Simulation">▦ Simulation</button><button data-filter="Control">◉ Robot Control</button><button data-filter="Embodied AI">✧ Embodied AI</button><button data-filter="Systems">⌘ ROS 2 / Systems</button></nav>
<main><h1>게시된 학습 자료</h1><p>실제로 저장소에 게시된 기술 분석 자료만 표시합니다. 질문 원문과 답변의 출처 상태를 각 문서에서 확인할 수 있습니다.</p>
<div class="bar"><input id="q" placeholder="⌕ 기술 용어, 질문, 키워드, 태그 검색..." aria-label="게시된 학습 자료 검색"></div>
<div class="grid" id="list">
<!--CARDS-->
</div><p id="empty" hidden>일치하는 게시 자료가 없습니다.</p></main></div><footer>로보틱스 학습 아카이브 · 실제 게시된 자료 <span id="total-count"></span>개</footer>
<script>let cat="all";document.getElementById("total-count").textContent=document.querySelectorAll(".article").length;function filter(){let q=document.getElementById("q").value.trim().toLowerCase(),shown=0;document.querySelectorAll(".article").forEach(a=>{let yes=(cat==="all"||a.dataset.category===cat)&&(a.innerText.toLowerCase()+" "+a.dataset.search).includes(q);a.hidden=!yes;if(yes)shown++});document.getElementById("empty").hidden=shown>0}document.querySelector("#q").addEventListener("input",filter);document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));filter()}));</script></body></html>
