<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics Knowledge Lab · Prototype</title>
<style>
:root{--bg:#111318;--panel:#1b1e24;--panel2:#252931;--text:#ecedef;--muted:#a1a6af;--line:#353940;--accent:#b7c5ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer}header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#17191e;position:sticky;top:0;z-index:10}.logo{font-size:19px;font-weight:750;letter-spacing:-.5px}.logo b{color:var(--accent)}.topright{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--line);padding:26px 15px;background:#17191e}aside .caption{padding:15px 13px 7px;font-size:11px;font-weight:700;color:#8f959f;letter-spacing:1.4px}.nav{border:0;color:#b5b7bc;background:none;text-align:left;padding:11px 13px;display:block;width:100%;border-radius:9px;font-size:14px}.nav.active,.nav:hover{background:#30353d;color:#fff}main{max-width:1270px;padding:36px 45px;width:100%;margin:auto}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1px}.hero{background:linear-gradient(125deg,#22262d,#1b1e25 65%,#272b31);border:1px solid #3c414a;border-radius:18px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;padding:32px;margin-bottom:29px}.hero h1{font-size:36px;line-height:1.3;letter-spacing:-1.5px;margin:12px 0}.muted{color:var(--muted);line-height:1.7}.search{background:#181b21;border:1px solid #4b5059;padding:15px 17px;color:white;border-radius:10px;width:100%;margin-top:18px;outline:none}.search:focus{border-color:var(--accent)}.robotpic{min-height:245px;border-radius:13px;background:radial-gradient(circle at 60% 40%,#454c56,#1b2028 70%);display:grid;place-items:center;overflow:hidden}.robotpic svg{width:90%;height:90%}h2{font-size:21px;margin:29px 0 15px}h3{margin:0 0 9px}.flex{display:flex;gap:12px;flex-wrap:wrap}.tag{background:#303840;color:#d0d9de;border:1px solid #4a5863;border-radius:100px;padding:6px 10px;font-size:11px;display:inline-block}.pill{background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:9px;color:#d7e5f5}.pill.selected{background:#434a52;border-color:#6f7b85}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);cursor:pointer;text-align:left;color:inherit;padding:0;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-3px);border-color:#a1aab3}.thumb{height:145px;display:grid;place-items:center;font-size:64px;background:linear-gradient(140deg,#2d333b,#242a31 60%,#363a42)}.cardbody{padding:19px}.cardbody h3{font-size:17px;line-height:1.45}.cardbody p{font-size:13px;color:var(--muted);line-height:1.65;min-height:44px}.cardfoot{font-size:12px;color:#a1a6af;margin-top:14px}.back{color:var(--accent);background:none;border:none;padding:0;margin-bottom:25px}.articlegrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:30px}.article{line-height:1.85}.article h1{font-size:34px;margin:6px 0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:23px;margin:21px 0}.panel h3{font-size:18px}.diagram{background:#181b21;border:1px solid #444a53;border-radius:10px;padding:15px;margin:15px 0}.diagram svg{width:100%;height:auto}.toc{position:sticky;top:96px;height:max-content}.toc div{padding:7px 0;color:#a4a9b2;font-size:13px}.ref{color:#b9c9d5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px}input[type=range]{width:100%;accent-color:#b3c1cd}.stat{color:#c4ccd3;font-size:12px}footer{padding:32px;text-align:center;color:#999da5;font-size:12px}.hidden{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.articlegrid{grid-template-columns:1fr}.toc{display:none}}@media(max-width:690px){header{padding:0 15px}.topright{display:none}.layout{display:block}aside{display:flex;overflow:auto;padding:8px;border-bottom:1px solid var(--line)}aside .caption{display:none}.nav{white-space:nowrap;width:auto}.hero{grid-template-columns:1fr;padding:22px}.robotpic{min-height:160px}main{padding:23px 18px}.cards{grid-template-columns:1fr}.hero h1{font-size:29px}.article h1{font-size:27px}}</style></head>
<body><header><div class="logo">◈ Robotics <b>Knowledge Lab</b></div><div class="topright">ChatGPT → GitHub MCP → GitHub Pages &nbsp; · &nbsp; UI PROTOTYPE</div></header>
<div class="layout"><aside><div class="caption">EXPLORE</div><button class="nav active" data-category="all">⌂ &nbsp; 모든 기술 자료</button><button class="nav" data-category="Simulation">▦ &nbsp; Simulation</button><button class="nav" data-category="Control">◉ &nbsp; Robot Control</button><button class="nav" data-category="Embodied AI">✧ &nbsp; Embodied AI</button><button class="nav" data-category="Systems">⌘ &nbsp; ROS 2 / Systems</button><div class="caption">MANAGEMENT</div><button class="nav" onclick="openWorkflow()">⇄ &nbsp; 게시 워크플로</button></aside>
<main><section id="home"><div class="hero"><div><div class="eyebrow">VISUAL-FIRST ROBOTICS LIBRARY</div><h1>분석하고, 시각화하고,<br>더 깊이 이해하기.</h1><p class="muted">ChatGPT에서 학습한 로보틱스 지식과 기술 기사를 이미지·시스템 구조도·인터랙티브 그래프와 함께 정리하는 개인 기술 자료실.</p><input class="search" id="search" placeholder="⌕  기술, 기사, 키워드 검색... (예: World Model)" oninput="renderCards()"></div><div class="robotpic"><svg viewBox="0 0 340 260"><defs><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#d0d7de"/><stop offset=".5" stop-color="#808e9b"/><stop offset="1" stop-color="#485662"/></linearGradient></defs><ellipse cx="180" cy="219" rx="145" ry="19" fill="#14283a"/><rect x="120" y="194" width="100" height="20" rx="8" fill="#50819d"/><rect x="140" y="162" width="62" height="40" rx="9" fill="url(#metal)"/><path d="M167 174 L114 120 L148 103 L195 155Z" fill="url(#metal)" stroke="#9fadb9" stroke-width="3"/><circle cx="130" cy="114" r="24" fill="#244a65" stroke="#c1c9d2" stroke-width="7"/><path d="M134 101 L188 57 L205 75 L145 133Z" fill="url(#metal)" stroke="#9fadb9" stroke-width="3"/><circle cx="197" cy="65" r="20" fill="#244a65" stroke="#c1c9d2" stroke-width="6"/><path d="M205 62 L250 83 L242 103 L192 82Z" fill="url(#metal)" stroke="#9fadb9" stroke-width="3"/><path d="M245 92 L271 91 L281 112" fill="none" stroke="#c1c9d2" stroke-width="11" stroke-linecap="round"/><path d="M272 112 L270 132 M283 112 L289 132" stroke="#e1e4e7" stroke-width="6" stroke-linecap="round"/><g fill="#b6c4ce"><circle cx="55" cy="69" r="3"/><circle cx="288" cy="45" r="4"/><circle cx="292" cy="183" r="3"/></g><g stroke="#6d7983" opacity=".4"><path d="M24 193H312M40 171H300M55 147H287" stroke-dasharray="3 6"/></g></svg></div></div>
<div class="flex" id="filters"><button class="pill selected" data-filter="all">전체</button><button class="pill" data-filter="Simulation">Simulation</button><button class="pill" data-filter="Control">Control</button><button class="pill" data-filter="Embodied AI">Embodied AI</button><button class="pill" data-filter="Systems">Systems</button></div><h2>기술 분석 · 시각화 자료</h2><div class="cards" id="cards"></div></section>
<section id="detail" class="hidden"></section></main></div><footer>DEMO / 모든 글과 데이터는 프로토타입 예시입니다. · Backend / MCP 연결 없음</footer>
<script>
const articles=[{id:'world',title:'World Model: 로봇이 미래를 예측하는 방법',category:'Embodied AI',emoji:'🧠',summary:'Action-conditioned 예측 모델과 기존 물리 시뮬레이터의 핵심 차이',tags:['World Model','VLA','AI'],updated:'2026.10.26'},{id:'jitter',title:'Manipulator Jitter와 제어 응답',category:'Control',emoji:'🦾',summary:'관절 진동의 원인과 시간 응답을 대화형 그래프로 살펴보기',tags:['PID','Jitter','Control'],updated:'2026.10.25'},{id:'omni',title:'Omniverse 기반 물류 디지털 트윈',category:'Simulation',emoji:'🏭',summary:'시뮬레이션과 실제 물류 시스템의 데이터 흐름 및 활용 분석',tags:['Omniverse','Isaac Sim','Digital Twin'],updated:'2026.10.24'},{id:'rt',title:'Linux PREEMPT_RT와 실시간 제어',category:'Systems',emoji:'⚙️',summary:'ROS 2 제어 루프와 Deadline, Latency, Jitter의 의미',tags:['RT Linux','ROS 2','Latency'],updated:'2026.10.23'}];
let filter='all';
function renderCards(){const q=document.getElementById('search').value.toLowerCase();const found=articles.filter(x=>(filter==='all'||x.category===filter)&&[x.title,x.summary,x.category,...x.tags].join(' ').toLowerCase().includes(q));document.getElementById('cards').innerHTML=found.map(a=>`<button class="card" onclick="openArticle('${a.id}')"><div class="thumb">${a.emoji}</div><div class="cardbody"><span class="eyebrow">${a.category.toUpperCase()}</span><h3>${a.title}</h3><p>${a.summary}</p><div class="flex">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="cardfoot">학습용 예시 · ${a.updated}</div></div></button>`).join('')||'<p class="muted">검색 결과가 없습니다.</p>'}
document.querySelectorAll('[data-filter],[data-category]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter||b.dataset.category;document.querySelectorAll('[data-filter]').forEach(n=>n.classList.toggle('selected',n.dataset.filter===filter));document.querySelectorAll('[data-category]').forEach(n=>n.classList.toggle('active',n.dataset.category===filter));showHome();renderCards()}));
function showHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('detail').classList.add('hidden');window.scrollTo(0,0)}
const diagram=`<div class="diagram"><svg viewBox="0 0 660 165" role="img" aria-label="데이터 흐름 개념도"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c2ccd3" stroke-width="1.5"/></marker></defs><g fill="#343b43" stroke="#a1b0bd" stroke-width="1.5"><rect x="15" y="38" width="143" height="80" rx="10"/><rect x="257" y="38" width="145" height="80" rx="10"/><rect x="500" y="38" width="145" height="80" rx="10"/></g><g fill="#eceef0" font-size="17" text-anchor="middle" font-family="sans-serif"><text x="86" y="72">Input</text><text x="86" y="96" font-size="12" fill="#bbc1c8">Observation / State</text><text x="329" y="72">Model</text><text x="329" y="96" font-size="12" fill="#bbc1c8">Prediction / Analysis</text><text x="572" y="72">Output</text><text x="572" y="96" font-size="12" fill="#bbc1c8">Decision / Action</text></g><g stroke="#c2ccd3" stroke-width="2.5" marker-end="url(#arr)"><path d="M160 78H251"/><path d="M405 78H492"/></g></svg><div class="stat">설명용 개념도 — 실제 시스템 설계나 제품 사양이 아닙니다.</div></div>`;
function openArticle(id){const a=articles.find(x=>x.id===id);document.getElementById('home').classList.add('hidden');const d=document.getElementById('detail');d.classList.remove('hidden');d.innerHTML=`<button class="back" onclick="showHome()">← 목록으로 돌아가기</button><div class="articlegrid"><div class="article"><div class="eyebrow">${a.category.toUpperCase()} / TECHNICAL ANALYSIS</div><h1>${a.title}</h1><p class="muted">${a.summary}</p><div class="flex">${a.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="panel"><h3>01. 핵심 분석</h3><p>${id==='world'?'월드 모델은 현재 상태와 행동을 바탕으로 미래의 관측 또는 상태를 예측하는 학습 모델입니다. 실제 로봇 적용을 위해서는 예측 정확도와 물리적 일관성 검증이 필요합니다.':id==='jitter'?'로봇 관절 지터는 위치 또는 속도의 불규칙한 진동과 관련됩니다. 제어기 게인, 센서 노이즈, 기계적 유격 등 여러 원인을 구분해야 합니다.':id==='rt'?'실시간 시스템은 평균 속도보다 일정한 시간 제한 내 작업을 마치는 예측 가능성이 중요합니다. PREEMPT_RT는 지연 감소에 도움을 주지만 안전을 자동으로 보장하지 않습니다.':'디지털 트윈은 로봇·물류 설비와 가상 환경의 상태를 연계하여 검증, 계획 또는 운영 분석에 활용하는 접근입니다.'}</p></div><div class="panel"><h3>02. 시스템 구조도</h3>${diagram}<p class="muted">실제 게시 시 ChatGPT가 생성한 Mermaid, SVG 또는 원본 이미지 파일로 대체됩니다.</p></div>${id==='jitter'?`<div class="panel"><h3>03. 인터랙티브 감쇠 진동 모델</h3><div class="diagram"><svg viewBox="0 0 600 230" id="jitterGraph"><path d="M38 113H575" stroke="#8a949f" stroke-dasharray="6 6"/><path id="wave" stroke="#bac6cf" stroke-width="3" fill="none"/></svg></div><div class="controls"><label>진폭 <span id="ampLabel">0.65</span><input type="range" id="amp" min=".1" max="1" step=".05" value=".65" oninput="drawWave()"></label><label>주파수 <span id="freqLabel">6</span><input type="range" id="freq" min="2" max="12" value="6" oninput="drawWave()"></label></div><p class="stat">교육용 합성 모델입니다. 실측한 로봇 데이터가 아닙니다.</p></div>`:`<div class="panel"><h3>03. 학습 시각화 포인트</h3><p class="muted">${id==='world'?'예측된 미래 프레임을 나란히 비교하거나 action-conditioned prediction 흐름을 표시하는 형태로 확장할 수 있습니다.':id==='rt'?'일반 커널과 RT 커널의 지연시간 분포를 동일 조건의 측정 데이터로 비교하는 차트가 적합합니다.':'창고 로봇과 디지털 트윈의 데이터 통신, 센서 흐름, 시뮬레이터 구성을 단계별로 시각화할 수 있습니다.'}</p></div>`}<div class="panel"><h3>04. 참고자료 / 원문</h3><p><a class="ref" href="https://docs.ros.org/" target="_blank" rel="noopener">ROS Documentation ↗</a> · <a class="ref" href="https://developer.nvidia.com/omniverse" target="_blank" rel="noopener">NVIDIA Omniverse ↗</a></p><p class="stat">실제 게시 시 해당 글에 직접 해당하는 출처 링크만 연결합니다.</p></div></div><aside class="toc panel"><strong>이 문서에서</strong><div>01. 핵심 분석</div><div>02. 시스템 구조도</div><div>03. 시각화</div><div>04. 참고자료</div><hr style="border-color:#2c4059"><div>키워드: ${a.tags.join(' · ')}</div></aside></div>`;window.scrollTo(0,0);if(id==='jitter')drawWave()}
function drawWave(){const amp=+document.getElementById('amp').value,f=+document.getElementById('freq').value;document.getElementById('ampLabel').textContent=amp.toFixed(2);document.getElementById('freqLabel').textContent=f;const pts=Array.from({length:250},(_,i)=>{const t=i/249*5;return `${38+i/249*537},${113-amp*82*Math.exp(-t*.36)*Math.sin(2*Math.PI*f*t/5)}`});document.getElementById('wave').setAttribute('d','M'+pts.join(' L'))}
function openWorkflow(){document.getElementById('home').classList.add('hidden');const d=document.getElementById('detail');d.classList.remove('hidden');d.innerHTML=`<button class="back" onclick="showHome()">← 홈으로</button><h1>게시 워크플로</h1><p class="muted">이 프로토타입에는 실제 MCP/GitHub 연결이 없습니다. 목표로 하는 작업 흐름의 설명입니다.</p><div class="panel"><h3>1. ChatGPT에서 분석과 시각화 생성</h3>기술 질문 → 답변 / 시각화 / 출처 확인</div><div class="panel"><h3>2. 게시 요청</h3>답변을 MDX와 이미지·SVG 파일로 변환 → GitHub MCP로 브랜치 및 PR 생성</div><div class="panel"><h3>3. 검토와 배포</h3>Pull Request 승인·병합 → GitHub Actions 빌드 → GitHub Pages 공개</div><div class="panel"><h3>4. 관리</h3>문서 수정과 새 글 게시도 동일하게 ChatGPT → GitHub PR 흐름으로 진행</div>`;window.scrollTo(0,0)}
renderCards();
</script></body></html>
